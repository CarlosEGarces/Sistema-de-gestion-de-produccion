<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antojito's Cakes — Gestión de Producción</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/angel-club" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<link rel="icon" type="image/png" href="shared/img/favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="shared/img/icon-192.png">
<meta name="theme-color" content="#1A1A2E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img src="shared/img/logo.png" alt="Antojito's Cakes" class="login-logo-img">
    <div class="login-logo">Antojito's Cakes</div>
    <div class="login-sub">Gestión de Producción</div>

    <form id="formLogin">
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <div class="error-text" id="errorMsg"></div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;" id="btnEntrar">
        Entrar
      </button>
    </form>
  </div>
</div>

<script src="shared/supabaseClient.js"></script>
<script>
(async () => {
  // Si ya hay sesión activa, saltar directo al home
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) location.href = 'home.html';
})();

document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('errorMsg');
  const btn = document.getElementById('btnEntrar');

  errorEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    errorEl.textContent = 'Correo o contraseña incorrectos.';
    errorEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  // Confirmar que el usuario tiene un perfil activo antes de dejarlo entrar
  const { data: perfil, error: perfilError } = await supabaseClient
    .from('perfiles')
    .select('activo')
    .eq('id', data.user.id)
    .single();

  if (perfilError || !perfil || !perfil.activo) {
    await supabaseClient.auth.signOut();
    errorEl.textContent = 'Este usuario no tiene acceso al sistema.';
    errorEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  location.href = 'home.html';
});
</script>
</body>
</html>
